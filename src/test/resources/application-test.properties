# In-memory H2 database in PostgreSQL mode, loaded with the same database.sql used by the real database.
spring.datasource.url=jdbc:h2:mem:cocos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:database.sql,file:db/indexes.sql
# In-memory cache: tests do not need Redis. Hibernate statistics let tests count the SQL statements executed.
app.cache.type=memory
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
