spring.application.name=llallire

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cocos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.pool-name=llallire-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# The schema comes from database.sql (+ db/indexes.sql); Hibernate does not modify it.
spring.jpa.hibernate.ddl-auto=none
# Transactions are bounded by the use cases; the session is not kept open during the view.
spring.jpa.open-in-view=false

# Cache: redis (default) | memory | none. See README "Variables de entorno".
app.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Short timeouts: if Redis is slow or down, requests fall back to the database quickly.
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
# After a cache error, skip the cache for this long instead of waiting for a timeout on every call.
app.cache.failure-cooldown=${CACHE_FAILURE_COOLDOWN:30s}
# Redis is only a cache (RedisCacheManager); there are no Redis repositories. Without this, Spring Data Redis also
# scans the JPA repositories at startup and logs that it cannot assign them to Redis.
spring.data.redis.repositories.enabled=false

# Logs include the trace and span ids injected by the OpenTelemetry agent (empty without agent), so a log line
# can be matched with its trace.
logging.pattern.level=%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]

# OpenAPI document at /v3/api-docs and Swagger UI at /swagger-ui.html (springdoc).
# Public by default (the docs are part of the challenge); API_DOCS_ENABLED=false hides both, e.g. in production.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
# springdoc warns at startup whenever Swagger UI is enabled, even when that is explicit; the switch above is the
# deliberate choice, so the warning is silenced.
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
# Each endpoint declares its own error responses; do not add every @ExceptionHandler status to every operation.
springdoc.override-with-generic-response=false
springdoc.show-actuator=false
